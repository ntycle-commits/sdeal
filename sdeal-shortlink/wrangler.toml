name = "sdeal-shortlink"
main = "worker.js"
compatibility_date = "2024-01-01"

[[kv_namespaces]]
binding = "SHORTLINKS_CACHE"
id = "d3dd00e19e254b1393de80e9be4e4d43"

[vars]
FIREBASE_PROJECT_ID = "sdeal-vn"

# Route: chỉ bắt các path dạng /XXXXXXXXXX (10 ký tự), các path khác forward sang Vercel.
# TODO (BẮT BUỘC): domain sdeal.vn CHƯA được add vào Cloudflare (chưa có zone) nên
# chưa bind được Route — tạm thời bỏ khối [[routes]] để deploy được Worker trước.
# Sau khi add domain vào Cloudflare (bật proxy/orange-cloud), mở lại khối này rồi
# chạy `npx wrangler deploy` lại lần nữa:
# [[routes]]
# pattern = "sdeal.vn/*"
# zone_name = "sdeal.vn"
